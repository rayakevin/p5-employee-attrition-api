name: CD Portfolio

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      git_ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main
        type: string

concurrency:
  group: cd-portfolio-${{ github.event.workflow_run.head_branch || inputs.target_environment || github.ref_name || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy-portfolio-to-hf-space:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ (github.event.workflow_run.head_branch || inputs.target_environment) == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || inputs.git_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Streamlit Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Portfolio Space repository content
        run: |
          mkdir -p hf-space-sync
          cp Dockerfile.streamlit hf-space-sync/Dockerfile
          cp requirements.streamlit.txt hf-space-sync/requirements.streamlit.txt
          cp deploy/huggingface/portfolio.README.md hf-space-sync/README.md
          rsync -av ui/ hf-space-sync/ui/
          rsync -av .streamlit/ hf-space-sync/.streamlit/

      - name: Validate Hugging Face portfolio token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"

      - name: Validate Hugging Face portfolio target
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"
          echo "Target Space: $HF_USERNAME/$HF_SPACE_NAME"

      - name: Validate Hugging Face portfolio git access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          git ls-remote "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME" HEAD

      - name: Push to Hugging Face Portfolio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          cd hf-space-sync
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy portfolio from GitHub Actions"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main

  smoke-test-portfolio:
    needs: deploy-portfolio-to-hf-space
    if: ${{ needs.deploy-portfolio-to-hf-space.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event.workflow_run.head_branch || inputs.target_environment) == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Probe deployed portfolio root page
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"

          SPACE_HOST=$(printf '%s-%s' "$HF_USERNAME" "$HF_SPACE_NAME" | tr '[:upper:]' '[:lower:]')
          BASE_URL="https://${SPACE_HOST}.hf.space"

          echo "Waiting for portfolio deployment on ${BASE_URL}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${BASE_URL}" > /dev/null; then
              echo "Portfolio root is reachable."
              exit 0
            fi
            echo "Attempt ${attempt}/30 failed for ${BASE_URL}; retrying in 10s..."
            sleep 10
          done

          echo "Smoke test failed for ${BASE_URL}"
          exit 1
