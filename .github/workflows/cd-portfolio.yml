name: CD Portfolio

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy-portfolio-to-hf-space:
    if: ${{ vars.HF_PORTFOLIO_SPACE_NAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Streamlit Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Portfolio Space repository content
        run: |
          mkdir -p hf-space-sync
          cp Dockerfile.streamlit hf-space-sync/Dockerfile
          cp requirements.streamlit.txt hf-space-sync/requirements.streamlit.txt
          cp deploy/huggingface/portfolio.README.md hf-space-sync/README.md
          rsync -av ui/ hf-space-sync/ui/
          rsync -av .streamlit/ hf-space-sync/.streamlit/

      - name: Push to Hugging Face Portfolio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"
          echo "Target Space: $HF_USERNAME/$HF_SPACE_NAME"
          cd hf-space-sync
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy portfolio from GitHub Actions"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main
