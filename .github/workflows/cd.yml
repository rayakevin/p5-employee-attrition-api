name: CD API

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      git_ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main
        type: string

concurrency:
  group: cd-api-${{ github.event.workflow_run.head_branch || inputs.target_environment || github.ref_name || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy-to-hf-space:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ (github.event.workflow_run.head_branch || inputs.target_environment) == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.workflow_run.head_sha || inputs.git_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Space repository content
        run: |
          mkdir -p hf-space-sync
          cp Dockerfile hf-space-sync/Dockerfile
          cp requirements.runtime.txt hf-space-sync/requirements.runtime.txt
          cp deploy/huggingface/README.md hf-space-sync/README.md
          cp pyproject.toml hf-space-sync/pyproject.toml
          rsync -av app/ hf-space-sync/app/
          rsync -av artifacts/ hf-space-sync/artifacts/
          mkdir -p hf-space-sync/scripts
          cp scripts/create_db.py hf-space-sync/scripts/create_db.py

      - name: Validate Hugging Face API token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"

      - name: Validate Hugging Face API target
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"
          echo "Target Space: $HF_USERNAME/$HF_SPACE_NAME"

      - name: Validate Hugging Face API git access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          git ls-remote "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME" HEAD

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          cd hf-space-sync
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from GitHub Actions"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main

  smoke-test-api:
    needs: deploy-to-hf-space
    if: ${{ needs.deploy-to-hf-space.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event.workflow_run.head_branch || inputs.target_environment) == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Probe deployed API endpoints
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"

          PUBLIC_SPACE_NAME=$(printf '%s' "$HF_SPACE_NAME" | tr '[:upper:]_' '[:lower:]-')
          SPACE_HOST=$(printf '%s-%s' "$HF_USERNAME" "$PUBLIC_SPACE_NAME")
          BASE_URL="https://${SPACE_HOST}.hf.space"

          echo "Waiting for API deployment on ${BASE_URL}"

          for endpoint in "/health" "/docs" "/openapi.json"; do
            success=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "${BASE_URL}${endpoint}" > /dev/null; then
                echo "Endpoint ${endpoint} is reachable."
                success=1
                break
              fi
              echo "Attempt ${attempt}/30 failed for ${endpoint}; retrying in 10s..."
              sleep 10
            done

            if [ "$success" -ne 1 ]; then
              echo "Smoke test failed for ${BASE_URL}${endpoint}"
              exit 1
            fi
          done
