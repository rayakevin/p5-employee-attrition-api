name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - docs/**
  pull_request:
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  P5_ENVIRONMENT: test
  P5_API_KEY: p5-test-key
  P5_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/p5_attrition

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p5_attrition
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p5_attrition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Create database schema
        run: |
          uv run python scripts/create_db.py

      - name: Seed source data
        run: |
          uv run python scripts/seed_data.py

      - name: Run tests
        run: |
          uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy-api:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: deploy-api-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Space repository content
        run: |
          mkdir -p hf-space-sync
          cp Dockerfile hf-space-sync/Dockerfile
          cp requirements.runtime.txt hf-space-sync/requirements.runtime.txt
          cp deploy/huggingface/README.md hf-space-sync/README.md
          cp pyproject.toml hf-space-sync/pyproject.toml
          rsync -av app/ hf-space-sync/app/
          rsync -av artifacts/ hf-space-sync/artifacts/
          mkdir -p hf-space-sync/scripts
          cp scripts/create_db.py hf-space-sync/scripts/create_db.py

      - name: Validate Hugging Face API token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"

      - name: Validate Hugging Face API target
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"
          echo "Target Space: $HF_USERNAME/$HF_SPACE_NAME"

      - name: Validate Hugging Face API git access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          git ls-remote "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME" HEAD

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          cd hf-space-sync
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from GitHub Actions"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main

  smoke-test-api:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') }}
    needs: deploy-api
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Probe deployed API endpoints
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"

          SPACE_HOST=$(printf '%s-%s' "$HF_USERNAME" "$HF_SPACE_NAME" | tr '[:upper:]' '[:lower:]')
          BASE_URL="https://${SPACE_HOST}.hf.space"

          echo "Waiting for API deployment on ${BASE_URL}"

          for endpoint in "/health" "/docs" "/openapi.json"; do
            success=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "${BASE_URL}${endpoint}" > /dev/null; then
                echo "Endpoint ${endpoint} is reachable."
                success=1
                break
              fi
              echo "Attempt ${attempt}/30 failed for ${endpoint}; retrying in 10s..."
              sleep 10
            done

            if [ "$success" -ne 1 ]; then
              echo "Smoke test failed for ${BASE_URL}${endpoint}"
              exit 1
            fi
          done

  deploy-portfolio:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: deploy-portfolio-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Streamlit Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Portfolio Space repository content
        run: |
          mkdir -p hf-space-sync
          cp Dockerfile.streamlit hf-space-sync/Dockerfile
          cp requirements.streamlit.txt hf-space-sync/requirements.streamlit.txt
          cp deploy/huggingface/portfolio.README.md hf-space-sync/README.md
          rsync -av ui/ hf-space-sync/ui/
          rsync -av .streamlit/ hf-space-sync/.streamlit/

      - name: Validate Hugging Face portfolio token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"

      - name: Validate Hugging Face portfolio target
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"
          echo "Target Space: $HF_USERNAME/$HF_SPACE_NAME"

      - name: Validate Hugging Face portfolio git access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          git ls-remote "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME" HEAD

      - name: Push to Hugging Face Portfolio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          cd hf-space-sync
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy portfolio from GitHub Actions"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main

  smoke-test-portfolio:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') }}
    needs: deploy-portfolio
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Probe deployed portfolio root page
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_PORTFOLIO_SPACE_NAME }}
        run: |
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"

          SPACE_HOST=$(printf '%s-%s' "$HF_USERNAME" "$HF_SPACE_NAME" | tr '[:upper:]' '[:lower:]')
          BASE_URL="https://${SPACE_HOST}.hf.space"

          echo "Waiting for portfolio deployment on ${BASE_URL}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${BASE_URL}" > /dev/null; then
              echo "Portfolio root is reachable."
              exit 0
            fi
            echo "Attempt ${attempt}/30 failed for ${BASE_URL}; retrying in 10s..."
            sleep 10
          done

          echo "Smoke test failed for ${BASE_URL}"
          exit 1
