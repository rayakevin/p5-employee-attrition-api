services:
  postgres:
    image: postgres:17
    container_name: p5_attrition_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-p5_attrition}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p5_attrition"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p5_attrition_api
    environment:
      P5_ENVIRONMENT: ${P5_ENVIRONMENT:-development}
      P5_DEBUG: ${P5_DEBUG:-true}
      P5_API_KEY: ${P5_API_KEY:-p5-dev-local-key}
      P5_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-p5_attrition}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: p5_attrition_portfolio
    environment:
      P5_ENVIRONMENT: ${P5_ENVIRONMENT:-development}
      P5_API_BASE_URL: ${P5_API_BASE_URL:-http://api:8000}
      P5_API_KEY: ${P5_API_KEY:-p5-dev-local-key}
      PORT: 8501
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
